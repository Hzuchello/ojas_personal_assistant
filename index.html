<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>v3.0</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./mark-drop.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Source+Serif+4:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="login-view" class="login-view">
    <form id="login-form" class="login-card" novalidate>
      <img class="brand-lockup" src="./logo-lockup.svg" alt="ojas calendar" />
      <p class="login-lead">Entre para ver a agenda.</p>
      <label>E-mail
        <input type="email" id="login-email" required autocomplete="username">
      </label>
      <label>Senha
        <input type="password" id="login-senha" required autocomplete="current-password">
      </label>
      <button type="submit" id="login-btn" class="login-btn">Entrar</button>
      <p id="login-erro" class="login-erro" hidden></p>
    </form>
  </div>

  <div id="app-view" hidden>
    <header class="app">
      <a class="brand" href="./index.html" aria-label="ojas calendar">
        <img class="brand-lockup" src="./logo-lockup.svg" alt="" />
      </a>
      <nav class="nav-pages">
        <a class="is-on" href="./index.html">Agenda</a>
      </nav>
      <div class="header-right">
        <span id="status" class="led" title="Status da agenda" aria-label="Status da agenda"></span>
        <button type="button" id="btn-sair" class="btn-sair">Sair</button>
      </div>
    </header>

    <main class="layout">
      <section class="cal-col">
        <div class="month-nav">
          <button type="button" id="prev" aria-label="Mês anterior">‹</button>
          <h2 id="monthLabel">setembro 2026</h2>
          <button type="button" id="next" aria-label="Próximo mês">›</button>
        </div>
        <div class="weekdays">
          <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="panel">
          <div class="when" id="dayLabel">—</div>
          <div id="list"></div>
        </div>
      </section>
      <aside class="note-col">
        <h3 id="nota-titulo">Anotações de hoje</h3>
        <textarea id="hoje-nota" class="hoje-nota" readonly></textarea>
        <div class="note-actions">
          <button type="button" id="btn-editar" class="note-btn">Editar</button>
          <button type="button" id="btn-salvar" class="note-btn note-btn--gold" hidden>Salvar</button>
          <button type="button" id="btn-cancelar" class="note-btn" hidden>Cancelar</button>
        </div>
        <p id="nota-hint" class="nota-hint"></p>
      </aside>
    </main>

    <section class="perf">
      <button type="button" class="acc-head" id="perf-toggle">
        <h3>Desempenho</h3>
        <span class="acc-icon" id="perf-icon">–</span>
      </button>
      <div class="acc-body" id="perf-body">
        <canvas id="chart" class="trade-chart"></canvas>
        <p id="chart-hint" class="nota-hint">
          <span class="leg-btg">BTG — cinza</span>
          <span class="leg-ylos">Ylos — dourado</span>
        </p>
      </div>
    </section>

    <section class="perf day-box">
      <button type="button" class="acc-head" id="acc-toggle">
        <h3>Detalhamento do mês</h3>
        <span class="acc-icon" id="acc-icon">–</span>
      </button>
      <div class="acc-body" id="acc-body">
        <div class="detalhe-top">
          <form class="trade-form" id="trade-form" autocomplete="off">
            <span class="trade-day" id="trade-day">—</span>
            <label>BTG <input id="in-btg" inputmode="decimal" placeholder="0,00"></label>
            <label>Ylos <input id="in-ylos" inputmode="decimal" placeholder="0,00"></label>
            <button type="submit">Salvar</button>
            <span class="trade-msg" id="trade-msg"></span>
          </form>
          <div class="totais">
            <div class="total-card">
              <span class="leg-btg">Total BTG</span>
              <strong id="total-btg">—</strong>
            </div>
            <div class="total-card">
              <span class="leg-ylos">Total Ylos</span>
              <strong id="total-ylos">—</strong>
            </div>
          </div>
        </div>
        <table class="trade-table" id="trade-table">
          <thead>
            <tr>
              <th>Dia</th>
              <th>BTG</th>
              <th>Ylos</th>
              <th>Dia</th>
              <th>BTG</th>
              <th>Ylos</th>
              <th>Dia</th>
              <th>BTG</th>
              <th>Ylos</th>
            </tr>
          </thead>
          <tbody id="trade-body"></tbody>
        </table>
      </div>
    </section>

    <div class="bot-widget" id="botWidget">
      <div class="bot-panel" id="botPanel" hidden>
        <div class="bot-bar">
          <img class="bot-mark" src="./mark-ring.svg" alt="" />
          <strong>ojas bot</strong>
          <button type="button" class="bot-close" id="botClose" aria-label="Fechar">×</button>
        </div>
        <div class="bot-thread" id="thread"></div>
        <form class="bot-form" id="ask" autocomplete="off">
          <input id="q" name="q" type="text" placeholder="O que agenda?" required>
          <button type="button" id="btn-mic" class="btn-mic" aria-label="Falar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          </button>
          <button type="submit">Enviar</button>
        </form>
      </div>
      <button type="button" class="bot-fab" id="botOpen" aria-label="Abrir Ôjas Bot">
        <img src="./mark-ring.svg" alt="" />
      </button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
