<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />
  <title>v.2.3.5</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./mark-drop.svg" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Source+Serif+4:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app-view">
    <header class="app">
      <a class="brand" href="./index.html" aria-label="ojas calendar">
        <img class="brand-lockup" src="./logo-lockup.svg" alt="" />
      </a>
      <nav class="nav-pages">
        <a href="./index.html">Agenda</a>
        <a class="is-on" href="./relatorio.html">Anotações</a>
      </nav>
      <div class="header-right">
        <div class="sub" id="rel-status">—</div>
        <button type="button" id="btn-sair" class="btn-sair">Sair</button>
      </div>
    </header>
    <main class="layout">
      <section class="cal-col">
        <div class="month-nav">
          <button type="button" id="prev-day" aria-label="Dia anterior">‹</button>
          <h2 id="dayLabel">—</h2>
          <button type="button" id="next-day" aria-label="Próximo dia">›</button>
        </div>
        <div class="relatorio-box">
          <textarea id="texto" placeholder="O que merece nota neste dia?"></textarea>
          <div class="relatorio-actions">
            <button type="button" class="icon-btn" id="btn-editar" title="Editar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 17.2V20h2.8l8.2-8.2-2.8-2.8L4 17.2zm14.7-8.5c.3-.3.3-.8 0-1.1l-1.8-1.8c-.3-.3-.8-.3-1.1 0l-1.4 1.4 2.8 2.8 1.5-1.3z"/></svg>
              Editar
            </button>
            <button type="button" class="icon-btn" id="btn-salvar" hidden title="Salvar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
              Salvar
            </button>
            <button type="button" class="icon-btn icon-btn--ghost" id="btn-cancelar" hidden title="Cancelar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
              Cancelar
            </button>
            <span id="save-hint"></span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="./relatorio.js"></script>
</body>
</html>
